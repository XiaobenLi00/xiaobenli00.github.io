<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景与双手</title>  <script type="module" crossorigin src="./assets/index-DkZJ8TWf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CD05NVxf.css">
</head>
<body>
<main>
  <section id="stage" aria-label="三维场景">
    <canvas id="scene" aria-label="可缩放的三维场景"></canvas>
    <nav class="view-controls" aria-label="观察">
      <button id="overview" class="active" aria-pressed="true">全景（可缩放）</button>
      <button id="device-view" aria-pressed="false">设备视角</button>
    </nav>
    <div id="loading" role="status">正在加载…</div>
  </section>
  <aside>
    <div class="settings">
      <label class="scene-select" for="scene-mode"><span>场景</span><select id="scene-mode"><option value="dense">稠密重建</option><option value="editable" selected>可编辑结构</option></select></label>
      <div class="visibility-controls">
        <label><input id="hands-visible" type="checkbox" checked>双手</label>
        <label><input id="trajectory-visible" type="checkbox" checked>设备轨迹</label>
      </div>
      <div class="physics-controls">
        <label title="开启后拖动门、柜门或抽屉"><input id="physics-enabled" type="checkbox" disabled>物理交互</label>
        <button id="physics-reset" disabled title="恢复所有部件的初始状态">重置</button>
      </div>
    </div>
    <div id="camera-grid" aria-label="六路原始鱼眼视频"></div>
    <p id="error" role="alert" hidden></p>
  </aside>
</main>
<footer>
  <button id="play" aria-label="播放" disabled>▶</button>
  <input id="timeline" type="range" min="0" max="101.399025" step="0.001" value="0" aria-label="播放进度" disabled>
  <output id="time">00:00.0 / 01:41.4</output>
</footer>
</body>
</html>
